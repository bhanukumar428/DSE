# Database Configuration
spring.datasource.url=jdbc:oracle:thin:@localhost:1521/FREEPDB1
spring.datasource.username=spring_user
spring.datasource.password=kristam@428
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.hikari.transaction-isolation=TRANSACTION_READ_COMMITTED
spring.datasource.hikari.auto-commit=false

# Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.transaction.jta.platform=org.springframework.orm.jpa.vendor.SpringJtaPlatform

# Additional Logging for SQL and Types
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE

# Spring JPA Open-In-View Setting
spring.jpa.open-in-view=false